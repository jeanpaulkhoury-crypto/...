```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEVERSE — 3D Game Cards</title>

<style>
/* ================================
   ОСНОВНЫЕ НАСТРОЙКИ
================================ */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #7c3aed55, transparent 30%),
        radial-gradient(circle at 80% 20%, #06b6d455, transparent 30%),
        radial-gradient(circle at 50% 80%, #ec489955, transparent 35%),
        #070814;

    overflow-x: hidden;
}


/* ================================
   HEADER
================================ */

header {
    padding: 70px 20px;
    text-align: center;
}

header h1 {
    margin: 0;

    font-size: clamp(50px, 9vw, 100px);

    background:
        linear-gradient(
            90deg,
            #ff0080,
            #7928ca,
            #00d4ff,
            #00ff88,
            #ffff00,
            #ff0080
        );

    background-size: 300%;

    -webkit-background-clip: text;
    color: transparent;

    animation: rainbow 7s linear infinite;
}

header p {
    max-width: 700px;
    margin: 25px auto;

    color: #b9bfd8;
    font-size: 18px;
}


/* ================================
   SEARCH
================================ */

.controls {
    width: min(1000px, 90%);
    margin: 0 auto 50px;

    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

input,
select {
    padding: 15px;

    border-radius: 14px;
    border: 1px solid #ffffff25;

    background: #ffffff0d;
    color: white;

    outline: none;
}

input {
    flex: 1;
    min-width: 250px;
}

select {
    min-width: 150px;
}

select option {
    background: #11152a;
}


/* ================================
   CARD GRID
================================ */

.game-grid {

    width: min(1200px, 92%);
    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}


/* ================================
   3D CARD CONTAINER
================================ */

.card-container {

    height: 430px;

    perspective: 1200px;

    cursor: pointer;
}


/* ================================
   CARD
================================ */

.game-card {

    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform 0.8s cubic-bezier(.2,.8,.2,1);

}


/* Поворот карточки */

.card-container:hover .game-card,
.card-container.flipped .game-card {

    transform: rotateY(180deg);

}


/* ================================
   ОБЕ СТОРОНЫ
================================ */

.card-front,
.card-back {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 25px;

    overflow: hidden;

    backface-visibility: hidden;

    border: 1px solid #ffffff22;

    box-shadow:
        0 25px 60px #00000066;

}


/* ================================
   FRONT
================================ */

.card-front {

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            #ffffff18,
            #ffffff05
        );

    backdrop-filter: blur(15px);

}


/* разноцветное свечение */

.card-front::before {

    content: "";

    position: absolute;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background:
        linear-gradient(
            45deg,
            #ff0080,
            #7928ca,
            #00d4ff,
            #00ff88
        );

    filter: blur(70px);

    opacity: .45;

    top: -80px;
    right: -80px;

    animation: rotateGlow 8s linear infinite;

}


/* ================================
   GAME ICON
================================ */

.game-icon {

    position: absolute;

    top: 35px;
    left: 35px;

    font-size: 90px;

    filter:
        drop-shadow(0 10px 20px #000);

    animation:
        floating 3s ease-in-out infinite;
}


/* ================================
   FRONT TEXT
================================ */

.card-front h2 {

    position: relative;

    margin: 0 0 8px;

    font-size: 30px;
}

.card-front p {

    position: relative;

    margin: 0;

    color: #b9bfd8;
}


/* ================================
   BACK
================================ */

.card-back {

    transform: rotateY(180deg);

    padding: 30px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    background:

        linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4,
            #ec4899
        );

}


/* ================================
   BACK CONTENT
================================ */

.card-back h2 {

    font-size: 30px;

    margin-top: 0;
}

.card-back p {

    line-height: 1.7;

    color: #ffffffdd;
}


/* ================================
   TAGS
================================ */

.tags {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin: 15px 0;
}

.tag {

    padding: 7px 11px;

    border-radius: 999px;

    background: #00000030;

    border: 1px solid #ffffff30;

    font-size: 12px;
}


/* ================================
   BUTTON
================================ */

.card-button {

    border: none;

    padding: 13px 20px;

    border-radius: 12px;

    background: white;

    color: #111;

    font-weight: bold;

    cursor: pointer;

    transition: .25s;
}

.card-button:hover {

    transform:
        scale(1.05);

    box-shadow:
        0 10px 30px #0005;
}


/* ================================
   ANIMATIONS
================================ */

@keyframes rainbow {

    0% {
        background-position: 0%;
    }

    50% {
        background-position: 100%;
    }

    100% {
        background-position: 0%;
    }
}


@keyframes rotateGlow {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes floating {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 900px) {

    .game-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 600px) {

    .game-grid {

        grid-template-columns: 1fr;
    }

    .card-container {

        height: 400px;
    }

}
</style>
</head>


<body>


<header>

    <h1>GAMEVERSE</h1>

    <p>
        Исследуй игры и карты.
        Наведи курсор или нажми на карточку,
        чтобы увидеть её обратную сторону.
    </p>

</header>


<!-- ================================
     SEARCH
================================ -->

<div class="controls">

    <input
        id="search"
        type="text"
        placeholder="🔎 Поиск игры или карты..."
    >

    <select id="filter">

        <option value="all">
            Все
        </option>

        <option value="game">
            Игры
        </option>

        <option value="map">
            Карты
        </option>

    </select>

</div>


<!-- ================================
     CARDS
================================ -->

<div
    id="gameGrid"
    class="game-grid"
></div>


<script>

/* ==================================
   DATABASE
================================== */

const games = [

    {
        id: 1,

        type: "game",

        title: "Neon Rift",

        icon: "⚡",

        genre: "Action",

        description:
            "Неоновая арена с быстрыми боями, порталами и динамическими эффектами.",

        tags: [
            "PvP",
            "Sci-Fi",
            "3D"
        ]
    },


    {
        id: 2,

        type: "game",

        title: "Kingdoms of Ember",

        icon: "🔥",

        genre: "RPG",

        description:
            "Фэнтезийное приключение с героями, магией, боссами и развитием персонажа.",

        tags: [
            "RPG",
            "Fantasy",
            "Boss"
        ]
    },


    {
        id: 3,

        type: "map",

        title: "Cyber District",

        icon: "🌆",

        genre: "Tactical",

        description:
            "Городская карта для тактических матчей с секретными маршрутами.",

        tags: [
            "Urban",
            "PvP",
            "Tactical"
        ]
    },


    {
        id: 4,

        type: "map",

        title: "Frozen Outpost",

        icon: "❄️",

        genre: "Strategy",

        description:
            "Снежная база с узкими проходами, обзорными точками и интерактивными объектами.",

        tags: [
            "Snow",
            "Strategy",
            "Co-op"
        ]
    },


    {
        id: 5,

        type: "game",

        title: "Skybound Racers",

        icon: "🏎️",

        genre: "Racing",

        description:
            "Аркадные воздушные гонки с ускорителями и изменяемыми трассами.",

        tags: [
            "Racing",
            "Arcade",
            "Online"
        ]
    },


    {
        id: 6,

        type: "map",

        title: "Jungle Temple",

        icon: "🌴",

        genre: "Adventure",

        description:
            "Древний храм в джунглях с ловушками, секретными комнатами и головоломками.",

        tags: [
            "Adventure",
            "Puzzle",
            "Explore"
        ]
    }

];


/* ==================================
   ELEMENTS
================================== */

const grid =
    document.getElementById("gameGrid");

const search =
    document.getElementById("search");

const filter =
    document.getElementById("filter");


/* ==================================
   RENDER CARDS
================================== */

function renderCards() {

    const query =
        search.value.toLowerCase();

    const selected =
        filter.value;


    const filtered =
        games.filter(game => {

            const matchesSearch =

                game.title
                    .toLowerCase()
                    .includes(query)

                ||

                game.genre
                    .toLowerCase()
                    .includes(query)

                ||

                game.tags
                    .join(" ")
                    .toLowerCase()
                    .includes(query);


            const matchesFilter =

                selected === "all"

                ||

                game.type === selected;


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    grid.innerHTML = "";


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:70px;
                    color:#aaa;
                "
            >

                🔍 Ничего не найдено.

            </div>

        `;

        return;
    }


    filtered.forEach(game => {

        const container =
            document.createElement("div");

        container.className =
            "card-container";


        container.innerHTML = `

            <div class="game-card">


                <!-- FRONT -->

                <div class="card-front">

                    <div class="game-icon">
                        ${game.icon}
                    </div>


                    <h2>
                        ${game.title}
                    </h2>


                    <p>
                        ${game.genre}
                    </p>

                </div>


                <!-- BACK -->

                <div class="card-back">

                    <h2>
                        ${game.title}
                    </h2>


                    <p>
                        ${game.description}
                    </p>


                    <div class="tags">

                        ${game.tags.map(tag => `

                            <span class="tag">
                                #${tag}
                            </span>

                        `).join("")}

                    </div>


                    <button
                        class="card-button"
                        onclick="
                            event.stopPropagation();
                            alert('Открываем: ${game.title}');
                        "
                    >

                        Открыть игру

                    </button>

                </div>


            </div>

        `;


        /* ==================================
           MOBILE CLICK
        ================================== */

        container.addEventListener(
            "click",
            () => {

                container.classList.toggle(
                    "flipped"
                );

            }
        );


        grid.appendChild(container);

    });

}


/* ==================================
   SEARCH EVENTS
================================== */

search.addEventListener(
    "input",
    renderCards
);


filter.addEventListener(
    "change",
    renderCards
);


/* ==================================
   INITIAL RENDER
================================== */

renderCards();

</script>

</body>
</html>
```
