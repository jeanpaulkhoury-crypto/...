<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#090b16" />
  <title>GAMEVERSE — Игры, карты и инструменты разработки</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--bg:#070814;--panel:rgba(17,21,42,.72);--text:#f7f8ff;--muted:#aab1cc;--line:rgba(255,255,255,.12);--a:#7c3aed;--b:#06b6d4;--c:#f43f5e;--d:#f59e0b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 0%,#26105c 0,transparent 32%),radial-gradient(circle at 90% 10%,#063b58 0,transparent 30%),linear-gradient(135deg,#070814,#0b1024 55%,#130719);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
    a{color:inherit;text-decoration:none}.wrap{width:min(1180px,92%);margin:auto}.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);background:rgba(7,8,20,.72);border-bottom:1px solid var(--line)}.navin{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.08em}.brand span{color:#22d3ee}.links{display:flex;gap:22px;color:var(--muted);font-size:14px}.links a:hover{color:#fff}.hero{min-height:650px;display:grid;place-items:center;position:relative}.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#8b5cf6,#f43f5e);filter:blur(70px);opacity:.18;animation:spin 12s linear infinite}.hero-content{position:relative;z-index:2;text-align:center;max-width:900px}.eyebrow{display:inline-flex;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:#c4b5fd;font-size:13px}.hero h1{font-size:clamp(48px,9vw,96px);line-height:.9;margin:24px 0 18px;letter-spacing:-.06em;background:linear-gradient(90deg,#fff,#67e8f9,#c4b5fd,#f9a8d4,#fde68a,#fff);background-size:300%;-webkit-background-clip:text;color:transparent;animation:gradient 7s ease infinite}.hero p{font-size:18px;color:var(--muted);max-width:700px;margin:0 auto 30px}.btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;padding:13px 20px;border-radius:14px;font-weight:800;cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.15)}.btn.primary{border:0;background:linear-gradient(135deg,#7c3aed,#06b6d4,#ec4899);background-size:180%;animation:gradient 5s ease infinite}.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 38px rgba(0,0,0,.28)}
    section{padding:90px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.section-head h2{font-size:38px;margin:0}.section-head p{color:var(--muted);max-width:600px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tool{padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(16px);transition:.3s}.tool:hover{transform:translateY(-7px);border-color:rgba(255,255,255,.3)}.icon{font-size:34px}.tag{display:inline-block;font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:#cbd5e1;margin-top:9px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:0 20px 60px rgba(0,0,0,.25);transition:.35s}.card:hover{transform:translateY(-8px) rotateX(2deg)}.art{height:210px;display:grid;place-items:center;font-size:70px;position:relative;overflow:hidden}.art:before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 90deg,#8b5cf6,#06b6d4,#22c55e,#f59e0b,#f43f5e,#8b5cf6);animation:spin 9s linear infinite;filter:blur(25px);opacity:.7}.art span{position:relative;z-index:1;filter:drop-shadow(0 8px 20px #000)}.card-body{padding:20px}.card h3{margin:0 0 8px;font-size:22px}.card p{color:var(--muted);line-height:1.6}.meta{display:flex;gap:8px;flex-wrap:wrap}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}.input,.select{border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;padding:13px 15px;border-radius:14px;outline:none}.input{flex:1;min-width:220px}.select option{background:#11152a}.security{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:26px;backdrop-filter:blur(18px)}.status{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#22c55e;box-shadow:0 0 18px #22c55e;animation:pulse 1.5s infinite}.code{font-family:ui-monospace,monospace;background:#05060d;padding:16px;border-radius:15px;overflow:auto;color:#a7f3d0}.method{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.step{padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045)}.step b{font-size:24px;color:#67e8f9}.footer{padding:45px 0;border-top:1px solid var(--line);color:var(--muted);text-align:center}.empty{text-align:center;color:var(--muted);padding:50px;grid-column:1/-1}
    @keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.4);opacity:.5}}
    @media(max-width:900px){.tools{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}.security{grid-template-columns:1fr}.method{grid-template-columns:1fr}.links{display:none}}
    @media(max-width:620px){section{padding:65px 0}.tools,.catalog{grid-template-columns:1fr}.hero{min-height:570px}.hero h1{font-size:58px}.section-head{display:block}.section-head h2{font-size:31px}.navin{height:62px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useMemo,useState}=React;

const games=[
 {id:1,type:"Игра",title:"Neon Rift",icon:"⚡",genre:"Action",desc:"Неоновая арена с быстрыми боями, эффектами частиц и динамическими порталами.",tags:["PvP","Sci‑Fi","3D"]},
 {id:2,type:"Игра",title:"Kingdoms of Ember",icon:"🔥",genre:"RPG",desc:"Фэнтезийное приключение: герои, магия, боссы и система развития персонажа.",tags:["RPG","Fantasy","Boss"]},
 {id:3,type:"Карта",title:"Cyber District",icon:"🌆",genre:"Map",desc:"Городская карта для тактических матчей с зонами риска и секретными маршрутами.",tags:["Urban","Tactical","PvP"]},
 {id:4,type:"Карта",title:"Frozen Outpost",icon:"❄️",genre:"Map",desc:"Снежная база с узкими проходами, обзорными точками и интерактивными объектами.",tags:["Snow","Strategy","Co‑op"]},
 {id:5,type:"Игра",title:"Skybound Racers",icon:"🏎️",genre:"Racing",desc:"Аркадные гонки в воздухе с ускорителями, прыжками и изменяемыми трассами.",tags:["Racing","Arcade","Online"]},
 {id:6,type:"Карта",title:"Jungle Temple",icon:"🌴",genre:"Map",desc:"Древний храм в джунглях: ловушки, скрытые комнаты и исследовательские маршруты.",tags:["Adventure","Puzzle","Explore"]}
];

function App(){
 const [q,setQ]=useState(""); const [type,setType]=useState("Все"); const [liked,setLiked]=useState([]);
 const visible=useMemo(()=>games.filter(g=>(type==="Все"||g.type===type)&&`${g.title} ${g.genre} ${g.tags.join(" ")}`.toLowerCase().includes(q.toLowerCase())),[q,type]);
 const toggleLike=id=>setLiked(x=>x.includes(id)?x.filter(v=>v!==id):[...x,id]);
 const encryptDemo=async()=>{const key=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]); const iv=crypto.getRandomValues(new Uint8Array(12)); const data=new TextEncoder().encode(JSON.stringify({favorites:liked,timestamp:Date.now()})); const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data); alert(`AES-GCM активирован. Зашифровано ${encrypted.byteLength} байт.`)};
 return <><nav className="nav"><div className="wrap navin"><div className="brand">GAME<span>VERSE</span></div><div className="links"><a href="#games">Игры</a><a href="#tools">Инструменты</a><a href="#method">Метод</a><a href="#security">Безопасность</a></div></div></nav>
 <header className="hero"><div className="hero-content"><span className="eyebrow">⚙️ Professional Developer Edition</span><h1>PLAY.<br/>CREATE.<br/>EXPLORE.</h1><p>Одностраничный игровой каталог с карточками игр и карт, современным React-интерфейсом, JSON/SQL-структурой данных и безопасным локальным хранилищем.</p><div className="btns"><a className="btn primary" href="#games">Исследовать каталог</a><a className="btn" href="#tools">Стек разработки</a></div></div></header>
 <main>
 <section id="tools"><div className="wrap"><div className="section-head"><div><h2>Инструменты разработки</h2><p>Стек проекта организован вокруг HTML, CSS, JavaScript, React, JSON и SQL.</p></div></div><div className="tools">
 {[
 ["🧱","HTML","Programming Language","Структура интерфейса"],["🎨","CSS","Programming Language","Анимации и visual effects"],["⚡","JavaScript","Programming Language","Логика и интерактивность"],["⚛️","React","Framework / Library","Компонентная архитектура"],["📦","JSON","Additional Tool","Структура данных"],["🗄️","SQL","Additional Tool","Схема игровой БД"],["🚀","Jetson Adapter","Database Layer","Интеграционный слой"],["🔐","Web Crypto","Security","AES-GCM для локальных данных"]
 ].map(x=><div className="tool" key={x[1]}><div className="icon">{x[0]}</div><h3>{x[1]}</h3><span className="tag">{x[2]}</span><p>{x[3]}</p></div>)}</div></div></section>
 <section id="games"><div className="wrap"><div className="section-head"><div><h2>Игры и карты</h2><p>Карточки содержат название, тип, жанр, описание и теги.</p></div></div><div className="filters"><input className="input" value={q} onChange={e=>setQ(e.target.value)} placeholder="🔎 Поиск игры, карты или жанра..." /><select className="select" value={type} onChange={e=>setType(e.target.value)}><option>Все</option><option>Игра</option><option>Карта</option></select></div><div className="catalog">{visible.length?visible.map(g=><article className="card" key={g.id}><div className="art"><span>{g.icon}</span></div><div className="card-body"><h3>{g.title}</h3><p>{g.desc}</p><div className="meta"><span className="tag">{g.type}</span><span className="tag">{g.genre}</span>{g.tags.map(t=><span className="tag" key={t}>{t}</span>)}</div><button className="btn" style={{marginTop:16}} onClick={()=>toggleLike(g.id)}>{liked.includes(g.id)?"❤️ Сохранено":"♡ Сохранить"}</button></div></article>):<div className="empty">Ничего не найдено. Измени запрос или фильтр.</div>}</div></div></section>
 <section id="method"><div className="wrap"><div className="section-head"><div><h2>Сохранённый метод: GREET → GIVE</h2><p>Принцип интерфейса: сначала поприветствовать и сориентировать пользователя, затем дать ему полезное действие или результат.</p></div></div><div className="method"><div className="step"><b>01</b><h3>GREET</h3><p>Приветственный hero-блок сразу объясняет назначение сайта и предлагает начать исследование.</p></div><div className="step"><b>02</b><h3>GIVE</h3><p>Пользователь получает карточки, поиск, фильтры, сохранение и понятную информацию без лишних переходов.</p></div><div className="step"><b>03</b><h3>VERIFY</h3><p>Состояние интерфейса обрабатывается с fallback-сценарием для пустых результатов и ошибок.</p></div></div></div></section>
 <section id="security"><div className="wrap"><div className="section-head"><div><h2>Security Layer</h2><p>Защита локального пользовательского состояния через Web Crypto API.</p></div></div><div className="security"><div className="panel"><div className="status"><span className="dot"></span><b>AES-GCM encryption ready</b></div><p style={{color:"#aab1cc",lineHeight:1.7}}>Кнопка ниже демонстрирует шифрование данных избранного. В production-системе ключи, аутентификация и серверная база должны находиться за пределами клиентского JavaScript.</p><button className="btn primary" onClick={encryptDemo}>🔐 Проверить шифрование</button></div><div className="panel"><div className="code">AES-256-GCM<br/>Random IV<br/>Authenticated encryption<br/>JSON payload<br/>SQL schema ready<br/>Fallback UI: enabled</div></div></div></div></section>
 </main><footer className="footer">GAMEVERSE • Professional single-page prototype • HTML + CSS + JavaScript + React + JSON + SQL</footer></>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
